<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Management | Retail Store</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#222;
}

/* HEADER */

.header{
    background:#1f2937;
    color:white;
    padding:22px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:25px;
}

.header p{
    margin-top:5px;
    color:#d1d5db;
    font-size:14px;
}

.home-button{
    background:white;
    color:#1f2937;
    border:none;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.home-button:hover{
    background:#e5e7eb;
}


/* CONTAINER */

.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 18px;
}


/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:25px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.summary-card h3{
    font-size:13px;
    color:#6b7280;
    margin-bottom:8px;
}

.summary-card .value{
    font-size:24px;
    font-weight:bold;
}


/* MAIN CARD */

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

.card-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}


/* TOOLS */

.tools{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search-box{
    flex:1;
    min-width:230px;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

.search-box:focus{
    border-color:#2563eb;
}

.select-box{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:white;
    min-width:160px;
}

.refresh-button{
    border:none;
    padding:12px 18px;
    border-radius:7px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.refresh-button:hover{
    background:#1d4ed8;
}


/* RESULT INFO */

.result-info{
    color:#6b7280;
    font-size:13px;
    margin-bottom:15px;
}


/* STOCK LIST */

.stock-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.stock-item{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    background:#fafafa;
}

.stock-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.product-name{
    font-size:18px;
    font-weight:bold;
}

.product-meta{
    color:#6b7280;
    font-size:13px;
    margin-top:5px;
}

.stock-status{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status-good{
    background:#dcfce7;
    color:#166534;
}

.status-low{
    background:#fef3c7;
    color:#92400e;
}

.status-out{
    background:#fee2e2;
    color:#991b1b;
}


/* STOCK DETAILS */

.stock-details{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-top:18px;
}

.detail-box{
    background:white;
    padding:12px;
    border-radius:8px;
    border:1px solid #e5e7eb;
}

.detail-label{
    font-size:11px;
    color:#6b7280;
    margin-bottom:5px;
}

.detail-value{
    font-weight:bold;
}


/* STOCK BAR */

.stock-bar-area{
    margin-top:16px;
}

.stock-bar-header{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#6b7280;
    margin-bottom:6px;
}

.stock-bar{
    width:100%;
    height:9px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
}

.stock-fill{
    height:100%;
    border-radius:10px;
    background:#16a34a;
}

.stock-fill.low{
    background:#f59e0b;
}

.stock-fill.out{
    background:#dc2626;
}


/* ACTIONS */

.actions{
    display:flex;
    gap:8px;
    margin-top:18px;
    flex-wrap:wrap;
}

.action-button{
    border:none;
    padding:9px 13px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.add-button{
    background:#dcfce7;
    color:#166534;
}

.reduce-button{
    background:#fee2e2;
    color:#991b1b;
}

.update-button{
    background:#dbeafe;
    color:#1d4ed8;
}

.action-button:hover{
    opacity:.8;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:40px;
    color:#6b7280;
}


/* FOOTER */

.footer{
    text-align:center;
    color:#6b7280;
    font-size:13px;
    padding:20px;
}


/* MOBILE */

@media(max-width:1000px){

    .summary{
        grid-template-columns:repeat(3,1fr);
    }

    .stock-details{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .header{
        padding:18px;
        flex-direction:column;
        align-items:flex-start;
    }

    .header h1{
        font-size:21px;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

    .stock-details{
        grid-template-columns:1fr 1fr;
    }

    .stock-top{
        flex-direction:column;
    }

}

@media(max-width:500px){

    .summary{
        grid-template-columns:1fr;
    }

    .stock-details{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

    .tools{
        flex-direction:column;
    }

    .search-box,
    .select-box,
    .refresh-button{
        width:100%;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <div>

        <h1>📦 Stock Management</h1>

        <p>
            Retail Store Inventory Control & Monitoring
        </p>

    </div>


    <button
        class="home-button"
        onclick="location.href='index.html'"
    >
        🏠 Back to Home
    </button>

</div>



<div class="container">


<!-- SUMMARY -->

<div class="summary">

    <div class="summary-card">

        <h3>Total Products</h3>

        <div
            class="value"
            id="totalProducts"
        >
            0
        </div>

    </div>


    <div class="summary-card">

        <h3>Total Stock</h3>

        <div
            class="value"
            id="totalStock"
        >
            0
        </div>

    </div>


    <div class="summary-card">

        <h3>Low Stock</h3>

        <div
            class="value"
            id="lowStock"
        >
            0
        </div>

    </div>


    <div class="summary-card">

        <h3>Out of Stock</h3>

        <div
            class="value"
            id="outOfStock"
        >
            0
        </div>

    </div>


    <div class="summary-card">

        <h3>Inventory Value</h3>

        <div
            class="value"
            id="inventoryValue"
        >
            ₹0
        </div>

    </div>

</div>



<!-- STOCK MANAGEMENT -->

<div class="card">

    <div class="card-title">
        📊 Inventory Overview
    </div>


    <div class="tools">

        <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="🔎 Search product, SKU or category..."
            oninput="showStock()"
        >


        <select
            id="statusFilter"
            class="select-box"
            onchange="showStock()"
        >

            <option value="all">
                All Stock
            </option>

            <option value="available">
                Available
            </option>

            <option value="low">
                Low Stock
            </option>

            <option value="out">
                Out of Stock
            </option>

        </select>


        <select
            id="sortBox"
            class="select-box"
            onchange="showStock()"
        >

            <option value="name">
                Sort: Name
            </option>

            <option value="stockHigh">
                Stock: High to Low
            </option>

            <option value="stockLow">
                Stock: Low to High
            </option>

            <option value="valueHigh">
                Value: High to Low
            </option>

            <option value="priceHigh">
                Price: High to Low
            </option>

        </select>


        <button
            class="refresh-button"
            onclick="showStock()"
        >
            🔄 Refresh
        </button>

    </div>


    <div
        class="result-info"
        id="resultInfo"
    >
        0 products
    </div>


    <div
        class="stock-list"
        id="stockList"
    ></div>

</div>

</div>



<div class="footer">

    Retail Store Management App • Inventory Module

</div>



<script>


/* GET PRODUCTS */

function getProducts(){

    return JSON.parse(
        localStorage.getItem("products")
    ) || [];

}


/* SAVE PRODUCTS */

function saveProducts(products){

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


/* HTML ESCAPE */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* SHOW STOCK */

function showStock(){

    let products = getProducts();


    let search =
        document.getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();


    let statusFilter =
        document.getElementById("statusFilter")
        .value;


    let sort =
        document.getElementById("sortBox")
        .value;


    /* SUMMARY */

    let totalProducts =
        products.length;

    let totalStock = 0;

    let lowStock = 0;

    let outOfStock = 0;

    let inventoryValue = 0;


    products.forEach(function(product){

        let stock =
            Number(product.stock) || 0;

        let price =
            Number(product.price) || 0;


        totalStock += stock;

        inventoryValue +=
            stock * price;


        if(stock === 0){

            outOfStock++;

        }

        else if(stock <= 5){

            lowStock++;

        }

    });


    document.getElementById("totalProducts")
        .innerText = totalProducts;


    document.getElementById("totalStock")
        .innerText = totalStock;


    document.getElementById("lowStock")
        .innerText = lowStock;


    document.getElementById("outOfStock")
        .innerText = outOfStock;


    document.getElementById("inventoryValue")
        .innerText =
        "₹" + inventoryValue.toFixed(2);



    /* FILTER */

    let filtered =
        products.filter(function(product){

            let name =
                String(product.name || "")
                .toLowerCase();

            let sku =
                String(product.id || "")
                .toLowerCase();

            let category =
                String(product.category || "")
                .toLowerCase();


            let matchesSearch =
                search === "" ||
                name.includes(search) ||
                sku.includes(search) ||
                category.includes(search);


            let stock =
                Number(product.stock) || 0;


            let matchesStatus = true;


            if(statusFilter === "available"){

                matchesStatus =
                    stock > 5;

            }

            else if(statusFilter === "low"){

                matchesStatus =
                    stock > 0 && stock <= 5;

            }

            else if(statusFilter === "out"){

                matchesStatus =
                    stock === 0;

            }


            return (
                matchesSearch &&
                matchesStatus
            );

        });



    /* SORT */

    if(sort === "name"){

        filtered.sort(function(a,b){

            return String(a.name)
                .localeCompare(String(b.name));

        });

    }


    else if(sort === "stockHigh"){

        filtered.sort(function(a,b){

            return Number(b.stock) -
                   Number(a.stock);

        });

    }


    else if(sort === "stockLow"){

        filtered.sort(function(a,b){

            return Number(a.stock) -
                   Number(b.stock);

        });

    }


    else if(sort === "valueHigh"){

        filtered.sort(function(a,b){

            return (
                Number(b.stock) *
                Number(b.price)
            ) -
            (
                Number(a.stock) *
                Number(a.price)
            );

        });

    }


    else if(sort === "priceHigh"){

        filtered.sort(function(a,b){

            return Number(b.price) -
                   Number(a.price);

        });

    }



    /* RESULT COUNT */

    document.getElementById("resultInfo")
        .innerText =
        filtered.length +
        " product(s) displayed";



    /* LIST */

    let list =
        document.getElementById("stockList");

    list.innerHTML = "";


    if(filtered.length === 0){

        list.innerHTML =
            '<div class="empty">' +
            '📭 No matching products found.' +
            '</div>';

        return;

    }



    filtered.forEach(function(product){

        let stock =
            Number(product.stock) || 0;

        let price =
            Number(product.price) || 0;


        let maxStock =
            Math.max(stock,10);


        let percentage =
            Math.min(
                (stock / maxStock) * 100,
                100
            );


        let statusClass =
            "status-good";

        let barClass =
            "";

        let statusText =
            "✅ Stock Available";


        if(stock === 0){

            statusClass =
                "status-out";

            barClass =
                "out";

            statusText =
                "⛔ OUT OF STOCK";

        }

        else if(stock <= 5){

            statusClass =
                "status-low";

            barClass =
                "low";

            statusText =
                "⚠️ LOW STOCK";

        }



        let inventoryValue =
            stock * price;


        let item =
            document.createElement("div");

        item.className =
            "stock-item";


        item.innerHTML = `

            <div class="stock-top">

                <div>

                    <div class="product-name">
                        📦 ${escapeHTML(product.name)}
                    </div>

                    <div class="product-meta">

                        SKU:
                        ${escapeHTML(product.id || "-")}

                        &nbsp; • &nbsp;

                        Category:
                        ${escapeHTML(product.category || "General")}

                    </div>

                </div>


                <div class="stock-status ${statusClass}">
                    ${statusText}
                </div>

            </div>



            <div class="stock-details">


                <div class="detail-box">

                    <div class="detail-label">
                        CURRENT STOCK
                    </div>

                    <div class="detail-value">
                        ${stock}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        PRICE
                    </div>

                    <div class="detail-value">
                        ₹${price.toFixed(2)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        INVENTORY VALUE
                    </div>

                    <div class="detail-value">
                        ₹${inventoryValue.toFixed(2)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        STATUS
                    </div>

                    <div class="detail-value">
                        ${stock === 0
                        ? "Out"
                        : stock <= 5
                        ? "Low"
                        : "Available"}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        PRODUCT ID
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(product.id || "-")}
                    </div>

                </div>

            </div>



            <div class="stock-bar-area">

                <div class="stock-bar-header">

                    <span>
                        Stock Level
                    </span>

                    <span>
                        ${stock} units
                    </span>

                </div>


                <div class="stock-bar">

                    <div
                        class="stock-fill ${barClass}"
                        style="width:${percentage}%"
                    ></div>

                </div>

            </div>



            <div class="actions">

                <button
                    class="action-button add-button"
                    onclick='quickAdd(${JSON.stringify(product.name)})'
                >
                    ➕ Add Stock
                </button>


                <button
                    class="action-button reduce-button"
                    onclick='quickReduce(${JSON.stringify(product.name)})'
                >
                    ➖ Reduce Stock
                </button>


                <button
                    class="action-button update-button"
                    onclick='updateStock(${JSON.stringify(product.name)})'
                >
                    ✏️ Update Stock
                </button>

            </div>

        `;


        list.appendChild(item);

    });

}



/* FIND PRODUCT */

function findProduct(productName){

    let products = getProducts();

    return products.find(function(product){

        return product.name.toLowerCase()
            === productName.toLowerCase();

    });

}


/* QUICK ADD STOCK */

function quickAdd(productName){

    let products = getProducts();

    let index =
        products.findIndex(function(product){

            return product.name.toLowerCase()
                === productName.toLowerCase();

        });


    if(index === -1){

        alert("❌ Product not found.");

        return;

    }


    let amount =
        prompt(
            "➕ Add Stock\n\n" +
            "Product: " +
            products[index].name +
            "\n\n" +
            "Current Stock: " +
            Number(products[index].stock) +
            "\n\n" +
            "Enter quantity to ADD:"
        );


    if(amount === null){

        return;

    }


    amount = Number(amount);


    if(
        isNaN(amount) ||
        amount <= 0 ||
        !Number.isInteger(amount)
    ){

        alert(
            "❌ Please enter a valid whole number."
        );

        return;

    }


    products[index].stock =
        Number(products[index].stock) +
        amount;


    saveProducts(products);


    alert(
        "✅ Stock Added Successfully!\n\n" +
        products[index].name +
        "\nAdded: " +
        amount +
        "\nNew Stock: " +
        products[index].stock
    );


    showStock();

}



/* QUICK REDUCE */

function quickReduce(productName){

    let products = getProducts();

    let index =
        products.findIndex(function(product){

            return product.name.toLowerCase()
                === productName.toLowerCase();

        });


    if(index === -1){

        alert("❌ Product not found.");

        return;

        Number(products[index].stock);

            products[in
